name: QMK Corne Build

on:
  push:
    branches:
      - miryoku_custom
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: d3adb5/build-qmk-fw@v1
      with:
        keyboard: crkbd/r2g
        keymap: miryoku_custom
        local-keymap-path: keyboards/crkbd/keymaps/miryoku_custom  # optional

    - name: Rename firmware
      run: |
        mv *.bin corne_left.bin || true
        # Note: the action may produce one firmware or two depending on split config

    - uses: actions/upload-artifact@v4
      with:
        name: corne-firmware
        path: corne_left.bin
