name: Build QMK Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your keymap repo
        uses: actions/checkout@v4

      - name: Checkout QMK Firmware (Full, With Submodules)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Copy your keymap into QMK
        run: |
          mkdir -p qmk_firmware/keyboards/crkbd/keymaps/miryoku_custom
          cp -R keyboards/crkbd/keymaps/miryoku_custom/* qmk_firmware/keyboards/crkbd/keymaps/miryoku_custom/

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3-pip
          pip3 install qmk

      - name: Setup QMK
        working-directory: qmk_firmware
        run: qmk setup --yes

      - name: Compile
        working-directory: qmk_firmware
        run: qmk compile -kb crkbd/r2g -km miryoku_custom

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-r2g-miryoku
          path: qmk_firmware/*.hex
