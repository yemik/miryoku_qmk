name: Build Miryoku Keymap

on:
  workflow_dispatch:   # Allows manual runs
  push:
    branches:
      - miryoku_legacy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QMK environment
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip git wget unzip
          pip3 install qmk
      
      - name: Initialize QMK
        run: qmk setup -y
      
      - name: Compile CRKBD R2G
        run: |
          cd qmk_firmware
          qmk compile -kb crkbd/r2g -km manna-harbour_miryoku
