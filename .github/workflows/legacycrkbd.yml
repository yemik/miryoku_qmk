name: Build Miryoku CRKBD Firmware

on:
  push:
    branches:
      - '**'       # triggers on any branch push
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout QMK Firmware (with submodules)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Copy Miryoku keymap into QMK firmware
        run: |
          mkdir -p qmk_firmware/keyboards/crkbd/keymaps/manna_harbour
          cp -R users/manna-harbour_miryoku/* qmk_firmware/keyboards/crkbd/keymaps/manna_harbour/

      - name: Install QMK dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3-pip
          pip3 install qmk

      - name: Setup QMK
        working-directory: qmk_firmware
        run: qmk setup --yes

      - name: Compile firmware
        working-directory: qmk_firmware
        run: qmk compile -kb crkbd/r2g -km manna_harbour

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-r2g-miryoku
          path: qmk_firmware/*.hex
