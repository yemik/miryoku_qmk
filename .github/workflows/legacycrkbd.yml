name: Build CRKBD R2G Miryoku Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3-pip
          pip3 install qmk

      - name: Setup QMK
        working-directory: qmk_firmware
        run: qmk setup --yes

      - name: Compile CRKBD R2G default Miryoku keymap
        working-directory: qmk_firmware
        run: qmk compile -kb crkbd/r2g -km miryoku

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: crkbd-r2g-miryoku
          path: qmk_firmware/*.hex
